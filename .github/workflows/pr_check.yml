name: Scan PR
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - develop

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    outputs:
      js: ${{ steps.filter.outputs.js }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Filter changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for k in js ios android; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi

          # PR checkout is a merge commit; ^1 is the base branch tip
          files=$(git diff --name-only HEAD^1 HEAD)
          shared='^package\.json$|^yarn\.lock$|^\.github/workflows/'

          check() {
            if printf '%s\n' "$files" | grep -qE "$2|$shared"; then v=true; else v=false; fi
            echo "$1=$v" >> "$GITHUB_OUTPUT"
          }

          check js      '^src/|^etc/api/|^tsconfig|^babel\.config|^jest|^api-extractor'
          check ios     '^ios/|^src/specs/|^example/ios/|\.podspec$|^scripts/xccov'
          check android '^android/|^src/specs/|^example/android/'

  build-lib:
    name: Build Nodes
    needs: [changes]
    uses: ./.github/workflows/build_lib.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      build-tgz: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e-tests') }}
      build-precompiled-sdk: true
      run-js-checks: ${{ needs.changes.outputs.js == 'true' }}

  test-iOS:
    name: Test iOS
    needs: [changes, build-lib]
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios_tests.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      device-version: ${{ vars.IOS_DEVICE_VERSION }}

  test-Android:
    name: Test Android
    needs: [changes, build-lib]
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android_tests.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      android-version: ${{ vars.ANDROID_VERSION }}

  run-sonar:
    name: Collect Sonar reports
    needs: [changes, build-lib, test-iOS, test-Android]
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure') &&
          (needs.changes.outputs.js == 'true' ||
           needs.changes.outputs.ios == 'true' ||
           needs.changes.outputs.android == 'true') }}
    uses: ./.github/workflows/run_sonar.yml
    secrets: inherit
    with:
      node-version: ${{ vars.NODE_VERSION }}

  e2e-react-native:
    name: React Native
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e-tests')
    needs: [build-lib]
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '0.76.8'
          - version: '0.85.3'
          - version: '0.87.1'
          - version: 'latest'
            allow-failure: true
    uses: ./.github/workflows/e2e_test.yml
    with:
      platform: 'react-native'
      version: ${{ matrix.version }}
      node-version: ${{ vars.NODE_VERSION }}
      allow-failure: ${{ matrix.allow-failure || false }}
    secrets:
      ADYEN_CLIENT_KEY: ${{ secrets.ADYEN_CLIENT_KEY }}
      ADYEN_PUBLIC_KEY: ${{ secrets.ADYEN_PUBLIC_KEY }}

  e2e-expo:
    name: Expo
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e-tests')
    needs: [build-lib]
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '52'
          - version: '55'
          - version: '57'
          - version: 'latest'
            allow-failure: true
    uses: ./.github/workflows/e2e_test.yml
    with:
      platform: 'expo'
      version: ${{ matrix.version }}
      node-version: ${{ vars.NODE_VERSION }}
      allow-failure: ${{ matrix.allow-failure || false }}
    secrets:
      ADYEN_CLIENT_KEY: ${{ secrets.ADYEN_CLIENT_KEY }}
      ADYEN_PUBLIC_KEY: ${{ secrets.ADYEN_PUBLIC_KEY }}

  android-agp9-build:
    name: Android AGP 9
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e-tests')
    needs: [build-lib]
    strategy:
      fail-fast: false
      matrix:
        mode: [builtin-kotlin, opt-out]
        rn-version: ['0.87.1', 'latest']
    uses: ./.github/workflows/android_agp9_build.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      rn-version: ${{ matrix.rn-version }}
      mode: ${{ matrix.mode }}
      allow-failure: ${{ matrix.mode == 'builtin-kotlin' || matrix.rn-version == 'latest' }}

name: Scan PR
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - develop

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-lib:
    name: Build Nodes
    uses: ./.github/workflows/build_lib.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      build-tgz: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e-tests') }}
      build-precompiled-sdk: true

  test-iOS:
    name: Test iOS
    needs: [build-lib]
    uses: ./.github/workflows/ios_tests.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      device-version: ${{ vars.IOS_DEVICE_VERSION }}

  test-Android:
    name: Test Android
    needs: [build-lib]
    uses: ./.github/workflows/android_tests.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      android-version: ${{ vars.ANDROID_VERSION }}

  run-sonar:
    name: Collect Sonar reports
    needs: [test-iOS, test-Android]
    uses: ./.github/workflows/run_sonar.yml
    secrets: inherit
    with:
      node-version: ${{ vars.NODE_VERSION }}

  e2e-react-native:
    name: React Native
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e-tests')
    needs: [build-lib]
    strategy:
      fail-fast: false
      matrix:
        include:
          # React Native CLI fixtures build through Swift Package Manager, so
          # only React Native versions that ship scripts/setup-apple-spm.js fit.
          - version: '0.87.1'
    uses: ./.github/workflows/e2e_test.yml
    with:
      platform: 'react-native'
      version: ${{ matrix.version }}
      node-version: ${{ vars.NODE_VERSION }}
      allow-failure: ${{ matrix.allow-failure || false }}
    secrets:
      ADYEN_CLIENT_KEY: ${{ secrets.ADYEN_CLIENT_KEY }}
      ADYEN_PUBLIC_KEY: ${{ secrets.ADYEN_PUBLIC_KEY }}

  e2e-expo:
    name: Expo
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e-tests')
    needs: [build-lib]
    strategy:
      fail-fast: false
      matrix:
        # SDK 56 is left out: its expo-modules-jsi (56.0.x) fails to compile
        # with the Xcode 27 Swift compiler; SDK 57 (expo-modules-jsi 57.1) builds.
        version: ['52', '55', '57', '58']
    uses: ./.github/workflows/e2e_test.yml
    with:
      platform: 'expo'
      version: ${{ matrix.version }}
      node-version: ${{ vars.NODE_VERSION }}
    secrets:
      ADYEN_CLIENT_KEY: ${{ secrets.ADYEN_CLIENT_KEY }}
      ADYEN_PUBLIC_KEY: ${{ secrets.ADYEN_PUBLIC_KEY }}

  android-agp9-build:
    name: Android AGP 9
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e-tests')
    needs: [build-lib]
    strategy:
      fail-fast: false
      matrix:
        mode: [builtin-kotlin, opt-out]
        rn-version: ['0.87.1', 'latest']
    uses: ./.github/workflows/android_agp9_build.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      rn-version: ${{ matrix.rn-version }}
      mode: ${{ matrix.mode }}
      allow-failure: ${{ matrix.mode == 'builtin-kotlin' || matrix.rn-version == 'latest' }}

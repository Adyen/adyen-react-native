name: Scan PR
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - develop

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-lib:
    name: Build Nodes
    uses: ./.github/workflows/build_lib.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      build-tgz: ${{ contains(github.event.pull_request.labels.*.name, 'run-e2e-tests') }}
      build-precompiled-sdk: true

  test-iOS:
    name: Test iOS
    needs: [build-lib]
    uses: ./.github/workflows/ios_tests.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      device-version: ${{ vars.IOS_DEVICE_VERSION }}

  test-Android:
    name: Test Android
    needs: [build-lib]
    uses: ./.github/workflows/android_tests.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      android-version: ${{ vars.ANDROID_VERSION }}

  run-sonar:
    name: Collect Sonar reports
    needs: [test-iOS, test-Android]
    uses: ./.github/workflows/run_sonar.yml
    secrets: inherit
    with:
      node-version: ${{ vars.NODE_VERSION }}

  e2e-react-native:
    name: React Native
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e-tests')
    needs: [build-lib]
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '0.76.8'
            node-version: '22'
          - version: '0.85.3'
            node-version: '22'
          - version: '0.87.1'
            node-version: '22'
          - version: '0.88.0'
            node-version: '22'
    uses: ./.github/workflows/e2e_test.yml
    with:
      platform: 'react-native'
      version: ${{ matrix.version }}
      node-version: ${{ matrix.node-version }}
    secrets:
      ADYEN_CLIENT_KEY: ${{ secrets.ADYEN_CLIENT_KEY }}
      ADYEN_PUBLIC_KEY: ${{ secrets.ADYEN_PUBLIC_KEY }}

  e2e-expo:
    name: Expo
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e-tests')
    needs: [build-lib]
    strategy:
      fail-fast: false
      matrix:
        version: ['52', '55', '58']
    uses: ./.github/workflows/e2e_test.yml
    with:
      platform: 'expo'
      version: ${{ matrix.version }}
      node-version: '22'
    secrets:
      ADYEN_CLIENT_KEY: ${{ secrets.ADYEN_CLIENT_KEY }}
      ADYEN_PUBLIC_KEY: ${{ secrets.ADYEN_PUBLIC_KEY }}

  android-agp9-build:
    name: Android AGP 9 (${{ matrix.mode }})
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e-tests')
    needs: [build-lib]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [builtin-kotlin, opt-out]
    env:
      APP_DIR: tested_app
      RN_VERSION: '0.87.1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate fixture
        run: bash ./e2e-tests/scripts/setup.sh "$APP_DIR" react-native "$RN_VERSION"

      - name: Download library
        uses: actions/download-artifact@v8
        with:
          name: built-tgz
          path: ${{ env.APP_DIR }}

      - name: Add library as dependency
        working-directory: ${{ env.APP_DIR }}
        run: |
          touch yarn.lock
          yarn add ./adyen-react-native.tgz

      - name: Set built-in Kotlin mode (${{ matrix.mode }})
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          # Don't rely on template defaults: remove both flags, then set them explicitly.
          sed -i '/^android\.builtInKotlin=/d;/^android\.newDsl=/d' gradle.properties
          echo >> gradle.properties
          if [ "${{ matrix.mode }}" = "opt-out" ]; then
            printf 'android.builtInKotlin=false\nandroid.newDsl=false\n' >> gradle.properties
          fi
          echo "== android.* properties in gradle.properties"
          grep -n '^android\.' gradle.properties || true

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew :app:assembleDebug --warning-mode all -PreactNativeArchitectures=x86_64
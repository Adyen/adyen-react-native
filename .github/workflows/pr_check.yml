name: Scan PR
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches:
      - develop

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      expo: ${{ steps.filter.outputs.expo }}
      e2e: ${{ steps.label.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Filter changed paths
        id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            for k in js ios android; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            echo "expo=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # PR checkout is a merge commit; ^1 is the base branch tip
          files=$(git diff --name-only HEAD^1 HEAD)
          shared='^package\.json$|^yarn\.lock$|^\.github/workflows/'

          check() {
            if printf '%s\n' "$files" | grep -qE "$2"; then v=true; else v=false; fi
            echo "$1=$v" >> "$GITHUB_OUTPUT"
          }

          check js      "$shared|^src/|^etc/api/|^tsconfig|^babel\.config|^jest|^api-extractor"
          check ios     "$shared|^ios/|^src/specs/|^example/ios/|\.podspec$|^react-native\.config\.js$|^scripts/xccov"
          check android "$shared|^android/|^src/specs/|^example/android/"
          # No $shared: package.json, yarn.lock and workflow changes run the Expo matrix only with the label.
          check expo    '^src/plugin/|^app\.plugin\.js$|^e2e-tests/scripts/configure-expo-app\.js$'

      # The opened event's payload lacks a label added right after creation (gh pr create --label),
      # and the concurrency group can cancel the labeled run, so read the labels as they are now.
      - name: Read e2e label
        id: label
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          e2e=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels?per_page=100" --jq 'any(.[]; .name == "run-e2e-tests")')
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  build-lib:
    name: Build Nodes
    needs: [changes]
    uses: ./.github/workflows/build_lib.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      build-tgz: ${{ needs.changes.outputs.e2e == 'true' || needs.changes.outputs.expo == 'true' }}
      build-precompiled-sdk: true
      run-js-checks: ${{ needs.changes.outputs.js == 'true' }}

  test-iOS:
    name: Test iOS
    needs: [changes, build-lib]
    if: needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios_tests.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      device-version: ${{ vars.IOS_DEVICE_VERSION }}

  test-Android:
    name: Test Android
    needs: [changes, build-lib]
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android_tests.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      android-version: ${{ vars.ANDROID_VERSION }}

  run-sonar:
    name: Collect Sonar reports
    needs: [changes, build-lib, test-iOS, test-Android]
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure') &&
          (needs.changes.outputs.js == 'true' ||
           needs.changes.outputs.ios == 'true' ||
           needs.changes.outputs.android == 'true') }}
    uses: ./.github/workflows/run_sonar.yml
    secrets: inherit
    with:
      node-version: ${{ vars.NODE_VERSION }}

  e2e-react-native:
    name: React Native (${{ matrix.version }}, ${{ matrix.ios-integration }}${{ matrix.use-frameworks && format(', {0} frameworks', matrix.use-frameworks) || '' }})
    needs: [changes, build-lib]
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Android does not depend on the iOS integration, so it runs once per version.
        include:
          - version: '0.79.7'
            ios-integration: 'cocoapods'
            release-archive: true
          - version: '0.85.3'
            ios-integration: 'cocoapods'
          - version: '0.87.1'
            ios-integration: 'spm'
            release-archive: true
          # The other CocoaPods entries cover the template's default linkage.
          - version: '0.87.1'
            ios-integration: 'cocoapods'
            use-frameworks: 'static'
            skip-android: true
            release-archive: true
          - version: 'latest'
            ios-integration: 'spm'
            allow-failure: true
          - version: 'latest'
            ios-integration: 'cocoapods'
            skip-android: true
            allow-failure: true
    uses: ./.github/workflows/e2e_test.yml
    with:
      platform: 'react-native'
      version: ${{ matrix.version }}
      node-version: ${{ vars.NODE_VERSION }}
      allow-failure: ${{ matrix.allow-failure || false }}
      ios-integration: ${{ matrix.ios-integration }}
      android: ${{ !matrix.skip-android }}
      release-archive: ${{ matrix.release-archive || false }}
      use-frameworks: ${{ matrix.use-frameworks || '' }}
    secrets:
      ADYEN_CLIENT_KEY: ${{ secrets.ADYEN_CLIENT_KEY }}
      ADYEN_PUBLIC_KEY: ${{ secrets.ADYEN_PUBLIC_KEY }}

  e2e-expo:
    name: Expo (${{ matrix.version }}, ${{ matrix.ios-integration }}${{ matrix.use-frameworks && format(', {0} frameworks', matrix.use-frameworks) || '' }})
    needs: [changes, build-lib]
    if: needs.changes.outputs.e2e == 'true' || needs.changes.outputs.expo == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '54'
            ios-integration: 'cocoapods'
            release-archive: true
          - version: '55'
            ios-integration: 'cocoapods'
          - version: '57'
            ios-integration: 'cocoapods'
            use-frameworks: 'static'
            release-archive: true
          - version: '58'
            ios-integration: 'spm'
            release-archive: true
          - version: 'latest'
            ios-integration: 'cocoapods'
            allow-failure: true
    uses: ./.github/workflows/e2e_test.yml
    with:
      platform: 'expo'
      version: ${{ matrix.version }}
      node-version: ${{ vars.NODE_VERSION }}
      allow-failure: ${{ matrix.allow-failure || false }}
      ios-integration: ${{ matrix.ios-integration }}
      release-archive: ${{ matrix.release-archive || false }}
      use-frameworks: ${{ matrix.use-frameworks || '' }}
    secrets:
      ADYEN_CLIENT_KEY: ${{ secrets.ADYEN_CLIENT_KEY }}
      ADYEN_PUBLIC_KEY: ${{ secrets.ADYEN_PUBLIC_KEY }}

  android-agp9-build:
    name: Android AGP 9
    needs: [changes, build-lib]
    if: needs.changes.outputs.e2e == 'true'
    strategy:
      fail-fast: false
      matrix:
        mode: [builtin-kotlin, opt-out]
        rn-version: ['0.87.1', 'latest']
    uses: ./.github/workflows/android_agp9_build.yml
    with:
      node-version: ${{ vars.NODE_VERSION }}
      rn-version: ${{ matrix.rn-version }}
      mode: ${{ matrix.mode }}
      allow-failure: ${{ matrix.mode == 'builtin-kotlin' || matrix.rn-version == 'latest' }}

# This workflow will run tests using node and then publish a package when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Publish Package
permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        type: string
  release:
    types: [published]

jobs:
  # package.json's "ios" files entry ships ios/frameworks/ wholesale. Needs its own macOS job.
  build-ios-frameworks:
    name: Build iOS xcframeworks
    uses: ./.github/workflows/build_ios_frameworks.yml

  publish-npm:
    name: Publish
    needs: [build-ios-frameworks]
    environment: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version == '' && github.ref_name || inputs.version }}
      NODE-VERSION: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE-VERSION }}
          registry-url: https://registry.npmjs.org/
      - name: Validate version is semver
        run: bash scripts/validate-semver.sh
      - name: Update version in package.json
        run: npm version "$VERSION" --no-git-tag-version
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Read pinned adyen-ios version
        id: adyen-ios-version
        run: echo "value=$(jq -r .adyen.ios package.json)" >> "$GITHUB_OUTPUT"

      # Restore-only: populated by build-ios-frameworks above, in this same run.
      - name: Restore iOS xcframeworks cache
        id: ios-frameworks-cache
        uses: actions/cache/restore@v4
        with:
          path: ios/frameworks
          key: ios-frameworks-${{ steps.adyen-ios-version.outputs.value }}

      - name: Fail if iOS xcframeworks cache is missing
        if: steps.ios-frameworks-cache.outputs.cache-hit != 'true'
        run: |
          echo "ios/frameworks/ cache miss - check build-ios-frameworks's logs." >&2
          exit 1

      - name: Publish to npm
        run: npm publish --access public

name: Build library
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      build-tgz:
        type: boolean
        default: true
      build-precompiled-sdk:
        type: boolean
        default: true

jobs:
  build-lib:
    name: Build Nodes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'yarn'

      - name: Build library
        run: |
          yarn install --frozen-lockfile
          yarn prepare

      - name: Check public API
        run: yarn api-extractor

      - name: Make JS coverage report
        run: |
          npx jest --coverage --coverageDirectory=reports

      - name: Archive JS Coverage report
        uses: actions/upload-artifact@v7
        with:
          name: js-coverage-report
          path: reports
          retention-days: 1

      - name: Read pinned adyen-ios version
        if: inputs.build-tgz
        id: adyen-ios-version
        run: echo "value=$(jq -r .adyen.ios package.json)" >> "$GITHUB_OUTPUT"

      # Restore-only - populated by build_ios_frameworks.yml. No Xcode needed to extract a tarball.
      - name: Restore iOS xcframeworks cache
        if: inputs.build-tgz
        id: ios-frameworks-cache
        uses: actions/cache/restore@v4
        with:
          path: ios/frameworks
          key: ios-frameworks-${{ steps.adyen-ios-version.outputs.value }}

      - name: Fail if iOS xcframeworks cache is missing
        if: inputs.build-tgz && steps.ios-frameworks-cache.outputs.cache-hit != 'true'
        run: |
          echo "ios/frameworks/ cache miss - check build_ios_frameworks.yml's logs." >&2
          exit 1

      - name: Create tgz
        if: inputs.build-tgz
        run: |
          npm pack
          mv adyen-react-native-*.tgz adyen-react-native.tgz

      - name: Archive tgz
        if: inputs.build-tgz
        uses: actions/upload-artifact@v7
        with:
          name: built-tgz
          path: adyen-react-native.tgz
          retention-days: 1

      - name: Archive precompiled SDK
        if: inputs.build-precompiled-sdk
        uses: actions/upload-artifact@v7
        with:
          name: built-lib
          path: lib
          retention-days: 1

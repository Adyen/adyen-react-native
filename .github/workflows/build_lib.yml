name: Build library
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string

jobs:
  build-lib:
    name: Build Nodes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'yarn'

      - name: Build library
        run: | 
          yarn install --frozen-lockfile
          yarn prepare

      - name: Make JS coverage report
        run: |
          npx jest --coverage --coverageDirectory=reports

      - name: Archive JS Coverage report
        uses: actions/upload-artifact@v6
        with:
          name: js-coverage-report
          path: reports
          retention-days: 1

      - name: Archive precompiled SDK
        uses: actions/upload-artifact@v6
        with:
          name: built-lib
          path: lib
          retention-days: 1

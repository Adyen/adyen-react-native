name: Update SDK Versions
permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to update (iOS or Android)'
        required: true
        type: choice
        options:
          - iOS
          - Android
      version:
        description: 'New SDK version'
        required: true
        type: string

jobs:
  update-sdk:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
      PLATFORM: ${{ github.event.inputs.platform }}

    steps:
    - uses: actions/checkout@v6

    - name: Update SDK version and badges $PLATFORM SDK to $VERSION
      run: |
        # Set platform-specific prefix and update SDK version
        if [ "$PLATFORM" = "iOS" ]; then
          PLATFORM_PREFIX="ios"
          SDK_FILE="adyen-react-native.podspec"
          SDK_PATTERN="s\.dependency \"Adyen\","
          sed -i "s/$SDK_PATTERN '[^']*'/$SDK_PATTERN '$VERSION'/" "$SDK_FILE"
        else
          PLATFORM_PREFIX="android"
          SDK_FILE="android/dependencies.gradle"
          SDK_PATTERN="adyen_version ="
          sed -i "s/$SDK_PATTERN \"[^\"]*\"/$SDK_PATTERN \"$VERSION\"/" "$SDK_FILE"
        fi
        
        # Update badge in README.md
        sed -i "s|${PLATFORM_PREFIX}-v[^-]*|${PLATFORM_PREFIX}-v$VERSION|g" README.md
        sed -i "s|${PLATFORM_PREFIX}/releases/tag/[^)]*|${PLATFORM_PREFIX}/releases/tag/$VERSION|g" README.md

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update $PLATFORM SDK to $VERSION"
        title: "Update $PLATFORM SDK to $VERSION"
        body: |
          # Open PR
          This PR updates the $PLATFORM SDK version to $VERSION.

          ## Changes:
          - Updated $PLATFORM SDK version in configuration files
          - Updated README.md badge for $PLATFORM SDK
        branch: update-$PLATFORM-sdk-$VERSION
        delete-branch: true
        draft: false

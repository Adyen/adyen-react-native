name: Update SDK Versions
permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to update (iOS or Android)'
        required: true
        type: choice
        options:
          - iOS
          - Android
      version:
        description: 'SDK version (leave empty to fetch latest release)'
        required: false
        type: string

jobs:
  update-sdk:
    runs-on: ubuntu-latest
    env:
      PLATFORM: ${{ inputs.platform }}

    steps:
    - uses: actions/checkout@v7

    - name: Fetch latest SDK version
      id: fetch-version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
        elif [ "$PLATFORM" = "iOS" ]; then
          VERSION=$(gh api repos/Adyen/adyen-ios/releases/latest --jq '.tag_name')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        else
          VERSION=$(gh api repos/Adyen/adyen-android/releases/latest --jq '.tag_name')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        fi

    - name: Update SDK version and badges ${{ inputs.platform }} SDK to ${{ steps.fetch-version.outputs.version }}
      env:
        VERSION: ${{ steps.fetch-version.outputs.version }}
      run: |
        # Set platform-specific sed flag (macOS requires empty backup extension)
        if [ "$(uname)" = "Darwin" ]; then SED_FLAG=(-i ''); else SED_FLAG=(-i); fi
        
        # Set platform-specific prefix and update SDK version
        if [ "$PLATFORM" = "iOS" ]; then
          PLATFORM_PREFIX="ios"
          # iOS ships through both CocoaPods (deprecated) and Swift Package Manager;
          # both manifests must pin the same Adyen iOS version.
          SDK_PATTERN="s\.dependency \"Adyen\","
          sed "${SED_FLAG[@]}" "s/$SDK_PATTERN '[^']*'/$SDK_PATTERN '$VERSION'/" adyen-react-native.podspec
          SPM_PATTERN='\.package(url: "https:\/\/github\.com\/Adyen\/adyen-ios", exact: '
          sed "${SED_FLAG[@]}" "s/$SPM_PATTERN\"[^\"]*\")/$SPM_PATTERN\"$VERSION\")/" ios/Package.swift
          grep -qF "s.dependency \"Adyen\", '$VERSION'" adyen-react-native.podspec \
            || { echo "::error::adyen-react-native.podspec does not pin Adyen $VERSION"; exit 1; }
          grep -qF ".package(url: \"https://github.com/Adyen/adyen-ios\", exact: \"$VERSION\")" ios/Package.swift \
            || { echo "::error::ios/Package.swift does not pin adyen-ios $VERSION"; exit 1; }
        else
          PLATFORM_PREFIX="android"
          SDK_FILE="android/dependencies.gradle"
          SDK_PATTERN="adyen_version ="
          sed "${SED_FLAG[@]}" "s/$SDK_PATTERN \"[^\"]*\"/$SDK_PATTERN \"$VERSION\"/" "$SDK_FILE"
        fi
        
        # Update badge in README.md
        sed "${SED_FLAG[@]}" "s|${PLATFORM_PREFIX}-v[^-]*|${PLATFORM_PREFIX}-v$VERSION|g" README.md
        sed "${SED_FLAG[@]}" "s|${PLATFORM_PREFIX}/releases/tag/[^)]*|${PLATFORM_PREFIX}/releases/tag/$VERSION|g" README.md

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update ${{ inputs.platform }} SDK to ${{ steps.fetch-version.outputs.version }}"
        title: "Update ${{ inputs.platform }} SDK to ${{ steps.fetch-version.outputs.version }}"
        branch: "update-${{ inputs.platform }}-${{ steps.fetch-version.outputs.version }}"
        labels: run-e2e-tests
        add-paths: |
          README.md
          adyen-react-native.podspec
          android/dependencies.gradle
          ios/Package.swift
        body: |
          # Open PR
          This PR updates the ${{ inputs.platform }} SDK version to ${{ steps.fetch-version.outputs.version }}.

          ## Changes:
          - Updated ${{ inputs.platform }} SDK version in configuration files
          - Updated README.md badge for ${{ inputs.platform }} SDK
        delete-branch: true
        draft: false

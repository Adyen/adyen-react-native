name: Update SDK Versions
permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to update (iOS or Android)'
        required: true
        type: choice
        options:
          - iOS
          - Android
      version:
        description: 'New SDK version'
        required: true
        type: string

jobs:
  update-sdk:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      PLATFORM: ${{ inputs.platform }}

    steps:
    - uses: actions/checkout@v6

    - name: Update SDK version and badges ${{ inputs.platform }} SDK to ${{ inputs.version }}
      run: |
        # Set platform-specific prefix and update SDK version
        if [ "$PLATFORM" = "iOS" ]; then
          PLATFORM_PREFIX="ios"
          SDK_FILE="adyen-react-native.podspec"
          SDK_PATTERN="s\.dependency \"Adyen\","
          sed -i "s/$SDK_PATTERN '[^']*'/$SDK_PATTERN '$VERSION'/" "$SDK_FILE"
        else
          PLATFORM_PREFIX="android"
          SDK_FILE="android/dependencies.gradle"
          SDK_PATTERN="adyen_version ="
          sed -i "s/$SDK_PATTERN \"[^\"]*\"/$SDK_PATTERN \"$VERSION\"/" "$SDK_FILE"
        fi
        
        # Update badge in README.md
        sed -i "s|${PLATFORM_PREFIX}-v[^-]*|${PLATFORM_PREFIX}-v$VERSION|g" README.md
        sed -i "s|${PLATFORM_PREFIX}/releases/tag/[^)]*|${PLATFORM_PREFIX}/releases/tag/$VERSION|g" README.md

    - name: Clean up unwanted file changes
      run: |
        git checkout -- example/android/gradlew.bat

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "chore: update ${{ inputs.platform }} SDK to ${{ inputs.version }}"
        title: "Update ${{ inputs.platform }} SDK to ${{ inputs.version }}"
        add-paths: |
          README.md
          adyen-react-native.podspec
          android/dependencies.gradle
        body: |
          # Open PR
          This PR updates the ${{ inputs.platform }} SDK version to ${{ inputs.version }}.

          ## Changes:
          - Updated ${{ inputs.platform }} SDK version in configuration files
          - Updated README.md badge for ${{ inputs.platform }} SDK
        delete-branch: true
        draft: false

name: Test iOS
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      device-version:
        required: true
        type: string

jobs:
  ios_tests:
    name: Test iOS
    runs-on: macos-15
    timeout-minutes: 45
    env:
      workspace: AdyenExample.xcworkspace
      scheme: AdyenExample
      buildFolder: ./DerivedData
      buildLogPath: ${{ github.workspace }}/xcodebuild.log
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'yarn'

      - name: Download precompiled SDK
        uses: actions/download-artifact@v8
        with:
          name: built-lib
          path: lib

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - uses: actions/cache@v5
        id: pods-cache
        with:
          path: |
            example/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('example/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Pod install
        working-directory: example/ios
        run: |
          if [ "${{ steps.pods-cache.outputs.cache-hit }}" != "true" ]; then
            pod install --repo-update
          else
            pod install
          fi

      - name: Resolve iOS Simulator
        id: simulator
        run: |
          UDID=$(bash ${{ github.workspace }}/e2e-tests/scripts/resolve_ios_simulator.sh "iPhone" "${{ inputs.device-version }}")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: example/ios
        run: |
          xcodebuild test \
            -workspace ${{ env.workspace }} \
            -scheme ${{ env.scheme }} \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ${{ env.buildFolder }} \
            -enableCodeCoverage YES \
            -allowProvisioningUpdates 2>&1 \
            | tee ${{ env.buildLogPath }} \
            | xcbeautify --renderer github-actions \
            && exit ${PIPESTATUS[0]}

      - name: Upload Xcodebuild Log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild_log_ios
          path: ${{ env.buildLogPath }}
          if-no-files-found: ignore
          retention-days: 1

      - name: Generate code Coverage
        run: |
          mkdir reports
          scripts/xccov-to-sonarqube-generic.sh \
            $(find example/ios -name "*.xcresult") \
            --filter "$PWD/ios" \
            --strip "$PWD/" \
            > reports/sonarqube-generic-coverage.xml

      - name: SwiftLint
        working-directory: ios
        run: |
          brew install swiftlint
          fastlane run swiftlint output_file:"${{ github.workspace }}/reports/swiftlint.json" reporter:"json" ignore_exit_status:"true"

      - name: Archive Coverage report
        uses: actions/upload-artifact@v7
        with:
          name: swift-coverage-report
          path: reports
          retention-days: 1

name: Test iOS
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      device-version:
        required: true
        type: string

jobs:
  ios_tests:
    name: Test iOS
    runs-on: macos-26
    timeout-minutes: 45
    env:
      project: AdyenExample.xcodeproj
      scheme: AdyenExample
      buildFolder: ./DerivedData
      buildLogPath: ${{ github.workspace }}/xcodebuild.log
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'yarn'

      - name: Download precompiled SDK
        uses: actions/download-artifact@v8
        with:
          name: built-lib
          path: lib

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      # async-storage ships no Package.swift; React Native's SPM tooling writes a
      # stopgap manifest into node_modules and regenerates the SPM build inputs.
      - name: Prepare Swift packages
        run: |
          yarn app spm-scaffold

      - name: Resolve iOS Simulator
        id: simulator
        run: |
          UDID=$(bash ${{ github.workspace }}/e2e-tests/scripts/resolve_ios_simulator.sh "iPhone" "${{ inputs.device-version }}")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        working-directory: example/ios
        run: |
          xcodebuild test \
            -project ${{ env.project }} \
            -scheme ${{ env.scheme }} \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath ${{ env.buildFolder }} \
            -enableCodeCoverage YES \
            -allowProvisioningUpdates 2>&1 \
            | tee ${{ env.buildLogPath }} \
            | xcbeautify --renderer github-actions \
            && exit ${PIPESTATUS[0]}

      - name: Upload Xcodebuild Log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild_log_ios
          path: ${{ env.buildLogPath }}
          if-no-files-found: ignore
          retention-days: 1

      # xccov only attributes coverage to the app and test targets, so the library's
      # Swift package sources are missing from its report. They are linked into the
      # app binary, so llvm-cov reads them from there.
      - name: Generate code Coverage
        run: |
          mkdir reports
          ROOT=$(pwd -P)
          PROFDATA=$(find example/ios/DerivedData -name Coverage.profdata | head -n 1)
          APP=$(find example/ios -type d -path '*/Products/Debug-iphonesimulator/AdyenExample.app' -not -path '*/Index.noindex/*' | head -n 1)
          OBJECTS=("$APP/AdyenExample")
          if [ -f "$APP/AdyenExample.debug.dylib" ]; then
            OBJECTS+=(-object "$APP/AdyenExample.debug.dylib")
          fi
          xcrun llvm-cov export -format=lcov -instr-profile "$PROFDATA" "${OBJECTS[@]}" \
            | swift scripts/xccov-to-sonarqube-generic.swift --filter "$ROOT/ios/" --strip "$ROOT/" \
            > reports/sonarqube-generic-coverage.xml

      - name: SwiftLint
        working-directory: ios
        run: |
          brew install swiftlint
          fastlane run swiftlint output_file:"${{ github.workspace }}/reports/swiftlint.json" reporter:"json" ignore_exit_status:"true"

      - name: Archive Coverage report
        uses: actions/upload-artifact@v7
        with:
          name: swift-coverage-report
          path: reports
          retention-days: 1

name: Test Android
permissions:
  contents: read
  actions: write

on:
  workflow_call:
    inputs:
      node-version:
        required: true
        type: string
      android-version:
        required: true
        type: string

jobs:
  test-Android:
    name: Test Android
    runs-on: ubuntu-24.04
    env:
      target: google_apis
      arch: x86_64
    steps:
      - uses: actions/checkout@v6

      - name: Setup Android Emulator
        uses: ./.github/actions/setup-android-emulator
        with:
          node-version: ${{ inputs.node-version }}
          android-api-level: ${{ inputs.android-version }}

      - name: Download library
        uses: actions/download-artifact@v7
        with:
          name: built-lib
          path: lib

      - name: Install dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.android-version }}
          target: ${{ env.target }}
          arch: ${{ env.arch }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: ./example/android
          script: |
            echo "::group::Running Android app"
            yarn android
            echo "::endgroup::"
            echo "::group::Running Tests"
            ./gradlew jacocoTestReport
            echo "::endgroup::"

      - name: Prepare Jacoco report
        run: |
          mkdir reports
          mv $(find . -name 'jacocoTestReport.xml') reports/jacoco.xml

      - name: Archive Coverage report
        uses: actions/upload-artifact@v6
        with:
          name: kotlin-coverage-report
          path: reports
          retention-days: 1

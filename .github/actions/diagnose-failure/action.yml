name: 'Diagnose E2E Failure'
description: 'Collect failed E2E job logs and ask a read-only Droid agent for a root-cause diagnosis'

inputs:
  factory-api-key:
    description: 'Factory API key used by Droid. When empty, Droid is skipped and the report says so.'
    required: false
    default: ''
  github-token:
    description: 'Token with read access to Actions (jobs, logs, artifacts). Never exposed to Droid.'
    required: true
  model:
    description: 'Model used by Droid'
    default: 'claude-sonnet-5-5'
  run-id:
    description: 'Workflow run to diagnose'
    default: ${{ github.run_id }}
  droid-version:
    description: 'Droid CLI version. Only the default version has a checksum pinned in this action.'
    default: '1.1.0'

outputs:
  report-path:
    description: 'Path of the generated report.md'
    value: ${{ steps.report.outputs.report-path }}
  has-failures:
    description: 'Whether failed E2E jobs were found'
    value: ${{ steps.collect.outputs.has_failures }}

runs:
  using: 'composite'
  steps:
    - name: Collect failed E2E jobs
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ inputs.run-id }}
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/e2e-diagnosis"
        mkdir -p "$out/artifacts"
        if ! node scripts/diagnose-ci-failure.js collect \
          --repo "$GITHUB_REPOSITORY" \
          --run-id "$RUN_ID" \
          --out-dir "$out"; then
          echo "::warning::Could not collect failed jobs; a fallback report will be generated"
          echo "collect_failed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Download xcodebuild logs
      if: steps.collect.outputs.has_failures == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: xcodebuild_log_*
        path: ${{ runner.temp }}/e2e-diagnosis/artifacts
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}

    - name: Download Appium failure screenshots
      if: steps.collect.outputs.has_failures == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: appium_failure_*
        path: ${{ runner.temp }}/e2e-diagnosis/artifacts
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}

    - name: Download Appium page sources
      if: steps.collect.outputs.has_failures == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: appium_page_source_*
        path: ${{ runner.temp }}/e2e-diagnosis/artifacts
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}

    - name: Download Android logs
      if: steps.collect.outputs.has_failures == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: android_logs_*
        path: ${{ runner.temp }}/e2e-diagnosis/artifacts
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}

    - name: Install Droid
      id: install
      if: steps.collect.outputs.has_failures == 'true' && inputs.factory-api-key != ''
      continue-on-error: true
      shell: bash
      env:
        DROID_VERSION: ${{ inputs.droid-version }}
        FACTORY_DROID_AUTO_UPDATE_ENABLED: 'false'
      run: |
        set -euo pipefail

        # Checksums are pinned only for the default version; they must be
        # updated together with the default of the droid-version input.
        pinned_version='1.1.0'
        pinned_sha_x64='90485af9cde0cb4c144a4c5464992ad1d3004f51929c60c2e0d33baba4764ad8'
        pinned_sha_x64_baseline='4508dec02980d0e98079962038838d08be27dc4b6050a5753830546796f7cb0e'
        pinned_sha_arm64='96c554b59271b44b68ee31755694cbc17b9257634d30e39aa16f2e0848a368e8'

        if ! [[ "$DROID_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid droid-version: $DROID_VERSION"
          exit 1
        fi

        # Same architecture selection as the official installer (https://app.factory.ai/cli)
        case "$(uname -m)" in
          x86_64|amd64) arch='x64' ;;
          arm64|aarch64) arch='arm64' ;;
          *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
        esac
        if [ "$arch" = 'x64' ] && ! grep -q -i avx2 /proc/cpuinfo 2>/dev/null; then
          arch='x64-baseline'
        fi

        base_url="https://downloads.factory.ai/factory-cli/releases/$DROID_VERSION/linux/$arch"
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT
        curl -fsSL --retry 3 -o "$tmp_dir/droid" "$base_url/droid"

        if [ "$DROID_VERSION" = "$pinned_version" ]; then
          case "$arch" in
            x64) expected="$pinned_sha_x64" ;;
            x64-baseline) expected="$pinned_sha_x64_baseline" ;;
            arm64) expected="$pinned_sha_arm64" ;;
          esac
        else
          echo "::warning::No pinned checksum for droid $DROID_VERSION; verifying against the published checksum"
          expected="$(curl -fsSL --retry 3 "$base_url/droid.sha256" | awk '{print $1}')"
        fi

        actual="$(sha256sum "$tmp_dir/droid" | awk '{print $1}')"
        if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
          echo "::error::Checksum mismatch for droid $DROID_VERSION ($arch)"
          exit 1
        fi

        install -d "$HOME/.local/bin"
        install -m 0755 "$tmp_dir/droid" "$HOME/.local/bin/droid"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Run Droid
      id: droid
      if: steps.collect.outputs.has_failures == 'true' && inputs.factory-api-key != '' && steps.install.outcome == 'success'
      continue-on-error: true
      timeout-minutes: 12
      shell: bash
      env:
        FACTORY_API_KEY: ${{ inputs.factory-api-key }}
        FACTORY_DROID_AUTO_UPDATE_ENABLED: 'false'
        MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/e2e-diagnosis"
        env -u GH_TOKEN -u GITHUB_TOKEN \
          droid exec \
          -f "$out/prompt.md" \
          --model "$MODEL" \
          --only-tools Read,Grep,Glob,LS \
          --cwd "$GITHUB_WORKSPACE" \
          -o json > "$out/droid.json"

    - name: Write report
      id: report
      if: always() && (steps.collect.outputs.has_failures == 'true' || steps.collect.outputs.collect_failed == 'true')
      shell: bash
      env:
        COLLECT_FAILED: ${{ steps.collect.outputs.collect_failed }}
        HAS_KEY: ${{ inputs.factory-api-key != '' }}
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        DROID_OUTCOME: ${{ steps.droid.outcome }}
        DROID_MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/e2e-diagnosis"
        reason_args=()
        if [ "$COLLECT_FAILED" = 'true' ]; then
          reason_args=(--reason collect-failed)
        elif [ "$HAS_KEY" != 'true' ]; then
          reason_args=(--reason missing-key)
        elif [ "$INSTALL_OUTCOME" != 'success' ] || [ "$DROID_OUTCOME" != 'success' ]; then
          reason_args=(--reason droid-failed)
        fi
        node scripts/diagnose-ci-failure.js report \
          --out-dir "$out" \
          --droid-output "$out/droid.json" \
          ${reason_args[@]+"${reason_args[@]}"}
        echo "report-path=$out/report.md" >> "$GITHUB_OUTPUT"

    - name: Upload report
      if: always() && (steps.collect.outputs.has_failures == 'true' || steps.collect.outputs.collect_failed == 'true')
      uses: actions/upload-artifact@v7
      with:
        name: e2e-failure-diagnosis
        path: ${{ runner.temp }}/e2e-diagnosis/report.md
        if-no-files-found: ignore
        retention-days: 1

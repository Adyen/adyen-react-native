name: 'Diagnose E2E Failure'
description: 'Collect failed E2E job logs and ask a read-only Droid agent for a root-cause diagnosis'

inputs:
  factory-api-key:
    description: 'Factory API key used by Droid. When empty, Droid is skipped and the report says so.'
    required: false
    default: ''
  github-token:
    description: 'Token with read access to Actions (jobs, logs, artifacts). Never exposed to Droid.'
    required: true
  model:
    description: 'Model used by Droid'
    default: 'claude-sonnet-5-5'
  run-id:
    description: 'Workflow run to diagnose'
    default: ${{ github.run_id }}
  droid-version:
    description: 'Droid CLI version. Only the default version has a checksum pinned in this action.'
    default: '1.1.0'

outputs:
  report-path:
    description: 'Path of the generated report.md'
    value: ${{ steps.report.outputs.report-path }}
  has-failures:
    description: 'Whether failed E2E jobs were found'
    value: ${{ steps.collect.outputs.has_failures }}

runs:
  using: 'composite'
  steps:
    - name: Collect failed E2E jobs
      id: collect
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RUN_ID: ${{ inputs.run-id }}
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/e2e-diagnosis"
        mkdir -p "$out/artifacts"
        if ! node scripts/diagnose-ci-failure.js collect \
          --repo "$GITHUB_REPOSITORY" \
          --run-id "$RUN_ID" \
          --out-dir "$out"; then
          echo "::warning::Could not collect failed jobs; a fallback report will be generated"
          echo "collect_failed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Download xcodebuild logs
      if: steps.collect.outputs.has_failures == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: xcodebuild_log_*
        path: ${{ runner.temp }}/e2e-diagnosis/artifacts
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}

    - name: Download Appium failure screenshots
      if: steps.collect.outputs.has_failures == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: appium_failure_*
        path: ${{ runner.temp }}/e2e-diagnosis/artifacts
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}

    - name: Download Appium page sources
      if: steps.collect.outputs.has_failures == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: appium_page_source_*
        path: ${{ runner.temp }}/e2e-diagnosis/artifacts
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}

    - name: Download Android logs
      if: steps.collect.outputs.has_failures == 'true'
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        pattern: android_logs_*
        path: ${{ runner.temp }}/e2e-diagnosis/artifacts
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ inputs.run-id }}

    - name: Install Droid
      id: install
      if: steps.collect.outputs.has_failures == 'true' && inputs.factory-api-key != ''
      continue-on-error: true
      uses: ./.github/actions/setup-droid
      with:
        droid-version: ${{ inputs.droid-version }}

    - name: Run Droid
      id: droid
      if: steps.collect.outputs.has_failures == 'true' && inputs.factory-api-key != '' && steps.install.outcome == 'success'
      continue-on-error: true
      shell: bash
      env:
        FACTORY_API_KEY: ${{ inputs.factory-api-key }}
        FACTORY_DROID_AUTO_UPDATE_ENABLED: 'false'
        MODEL: ${{ inputs.model }}
      run: |
        set -uo pipefail
        out="$RUNNER_TEMP/e2e-diagnosis"
        # Composite steps do not support timeout-minutes, so the deadline is
        # enforced here. A timeout (124) or any other non-zero status fails
        # this step, which makes the report step render the droid-failed case.
        status=0
        timeout --kill-after=30s 12m \
          env -u GH_TOKEN -u GITHUB_TOKEN \
          droid exec \
          -f "$out/prompt.md" \
          --model "$MODEL" \
          --only-tools Read,Grep,Glob,LS \
          --cwd "$GITHUB_WORKSPACE" \
          -o json > "$out/droid.json" || status=$?
        if [ "$status" -eq 124 ]; then
          echo "::warning::Droid did not finish within 12 minutes and was stopped"
        fi
        exit "$status"

    - name: Write report
      id: report
      if: always() && (steps.collect.outputs.has_failures == 'true' || steps.collect.outputs.collect_failed == 'true')
      shell: bash
      env:
        COLLECT_FAILED: ${{ steps.collect.outputs.collect_failed }}
        HAS_KEY: ${{ inputs.factory-api-key != '' }}
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        DROID_OUTCOME: ${{ steps.droid.outcome }}
        DROID_MODEL: ${{ inputs.model }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/e2e-diagnosis"
        reason_args=()
        if [ "$COLLECT_FAILED" = 'true' ]; then
          reason_args=(--reason collect-failed)
        elif [ "$HAS_KEY" != 'true' ]; then
          reason_args=(--reason missing-key)
        elif [ "$INSTALL_OUTCOME" != 'success' ] || [ "$DROID_OUTCOME" != 'success' ]; then
          reason_args=(--reason droid-failed)
        fi
        node scripts/diagnose-ci-failure.js report \
          --out-dir "$out" \
          --droid-output "$out/droid.json" \
          ${reason_args[@]+"${reason_args[@]}"}
        echo "report-path=$out/report.md" >> "$GITHUB_OUTPUT"

    - name: Upload report
      if: always() && (steps.collect.outputs.has_failures == 'true' || steps.collect.outputs.collect_failed == 'true')
      uses: actions/upload-artifact@v7
      with:
        name: e2e-failure-diagnosis
        path: ${{ runner.temp }}/e2e-diagnosis/report.md
        if-no-files-found: ignore
        retention-days: 1

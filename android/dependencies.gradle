ext {
    // Code quality
    jacoco_version = '0.8.12'

    // Adyen Dependencies
    // package.json's adyen.android is the single source of truth for this version (mirrors
    // adyen.ios, which adyen-react-native.podspec and CI's build_ios_frameworks.yml read the
    // same way) - bump it there, not here.
    def packageJson = new groovy.json.JsonSlurper().parse(new File(project.projectDir, '../package.json'))
    adyen_version = packageJson.adyen.android

    // Compose BOM (aligned with the version shipped by the Adyen v6 SDK)
    compose_bom_version = "2026.05.01"

    // Android Dependencies
    gson_version = "2.9.1"

    // Tests
    json_version = '20231013'
    junit_jupiter_version = "5.14.0"
    mockito_kotlin_version = "4.1.0"
    mockito_version = "4.11.0"
    robolectric_version = "4.16.1"

    testLibraries = [
            json            : "org.json:json:$json_version",
            junit5          : [
                    "org.junit.jupiter:junit-jupiter-api:$junit_jupiter_version",
                    "org.junit.jupiter:junit-jupiter-engine:$junit_jupiter_version",
                    "org.junit.jupiter:junit-jupiter-params:$junit_jupiter_version",
                    "org.junit.vintage:junit-vintage-engine:$junit_jupiter_version",
            ],
            mockito         : [
                    "org.mockito:mockito-junit-jupiter:$mockito_version",
                    "org.mockito:mockito-inline:$mockito_version",
                    "org.mockito.kotlin:mockito-kotlin:$mockito_kotlin_version"
            ],
            robolectric     : "org.robolectric:robolectric:$robolectric_version",
    ]
}
